[package]
name = "zylotek"
version = "0.1.0"
edition = "2024"

[dependencies]

[workspace]
resolver = "3"
members = [
    "crates/zylotek-cli",
    "crates/zylotek-sync",
    "crates/zylotek-domain",
    "crates/zylotek-application",
    "crates/zylotek-infrastructure",
    "crates/zylotek-api",
    "crates/zylotek-contracts",
]

[workspace.dependencies]
zylotek-domain = { path = "crates/zylotek-domain" }
zylotek-cli = { path = "crates/zylotek-cli" }
zylotek-sync = { path = "crates/zylotek-sync" }
zylotek-application = { path = "crates/zylotek-application" }
zylotek-infrastructure = { path = "crates/zylotek-infrastructure" }
log = "0.4.34"
simple_logger = "5.2.0"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
trait-variant = "0.1.3"
async-trait = "0.1.92"
tokio = { version = "1.53.2", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "native-tls",
] }
scraper = { version = "0.27.0" }
anyhow = "1.0.104"
thiserror = "2.0.21"
csv = "1.4.0"
uuid = { version = "1.27.0", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
axum = "0.8.9"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
toasty = { version = "0.11.0", features = ["sqlite"] }
toasty-cli = { version = "0.11.0" }
toasty-driver-sqlite = "0.11.0"
