default_stages = ["pre-commit"]
fail_fast = true

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-ast" },
  { id = "check-builtin-literals" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-illegal-windows-names" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-yaml", exclude = "deploy/helm/templates/.*" },
  { id = "debug-statements" },
  { id = "fix-byte-order-marker" },
  { id = "mixed-line-ending" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/doublify/pre-commit-rust"
rev = "v1.0"
hooks = [
  { id = "cargo-check" },
  { id = "fmt", args = ["--", "--check"] },
  # --workspace --all-targets so tests, benches and examples are linted (and
  # type-checked) too. Without them the gate never builds test code: E0-11 had
  # two test targets uncompilable on master for two commits, 33 tests silently
  # not running.
  { id = "clippy", args = ["--workspace", "--all-targets", "--", "-D", "warnings"] }
]
